<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#030201">
<title>ARCHIVO 404 | CHAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="toasts"></div>

<!-- ═══════════════ PANTALLA: BOOT ═══════════════ -->
<div id="boot">
  <div class="boot-inner">
    <div class="boot-logo">ARCHIVO_404</div>
    <div class="boot-sub">CHAT SEGURO</div>
    <div class="boot-bw"><div id="boot-bar"></div></div>
    <div id="boot-log"></div>
  </div>
</div>

<!-- ═══════════════ PANTALLA: AUTH (login / registro) ═══════════════ -->
<div id="screen-auth" class="screen">
  <div class="auth-card">
    <div class="auth-logo">⬡ ARCHIVO_404</div>
    <div class="auth-tabs">
      <button class="auth-tab act" id="tab-login" onclick="switchAuthTab('login')">INICIAR SESIÓN</button>
      <button class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">CREAR CUENTA</button>
    </div>

    <!-- LOGIN -->
    <form id="form-login" class="auth-form" onsubmit="return false;">
      <label class="fl-lbl">APODO</label>
      <input type="text" id="login-apodo" placeholder="tu_apodo" autocomplete="username">
      <label class="fl-lbl">CONTRASEÑA</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
      <button type="button" class="pbtn" onclick="doLogin()">ENTRAR AL SISTEMA</button>
      <div id="login-err" class="auth-err"></div>
    </form>

    <!-- REGISTRO -->
    <form id="form-register" class="auth-form hidden" onsubmit="return false;">
      <div class="avatar-picker" id="reg-avatar-picker" onclick="document.getElementById('reg-photo').click()">
        <img id="reg-avatar-preview" src="" class="hidden">
        <span id="reg-avatar-icon">📷</span>
        <span class="ap-hint">FOTO DE PERFIL (opcional)</span>
      </div>
      <input type="file" id="reg-photo" accept="image/*" class="hidden" onchange="previewRegAvatar(this)">
      <label class="fl-lbl">NOMBRE COMPLETO</label>
      <input type="text" id="reg-nombre" placeholder="Ej: Lenin Torres" autocomplete="name">
      <label class="fl-lbl">APODO (usuario único)</label>
      <input type="text" id="reg-apodo" placeholder="Ej: lenin404" autocomplete="username">
      <label class="fl-lbl">CONTRASEÑA</label>
      <input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
      <label class="fl-lbl">CONFIRMAR CONTRASEÑA</label>
      <input type="password" id="reg-pass2" placeholder="Repite la contraseña" autocomplete="new-password">
      <button type="button" class="pbtn" onclick="doRegister()">CREAR CUENTA</button>
      <div id="register-err" class="auth-err"></div>
    </form>
  </div>
</div>

<!-- ═══════════════ PANTALLA: APP (chat) ═══════════════ -->
<div id="screen-app" class="screen hidden">
  <div id="layout">
    <!-- SIDEBAR: lista de contactos -->
    <nav id="sidebar-chat">
      <div class="sc-hd">
        <div class="sc-me" onclick="openProfile('me')">
          <img id="me-avatar" class="sc-avatar" src="">
          <div>
            <div class="sc-me-name" id="me-name">—</div>
            <div class="sc-me-apodo" id="me-apodo">—</div>
          </div>
        </div>
        <button class="ic-btn" title="Cerrar sesión" onclick="doLogout()">⏻</button>
      </div>
      <div class="sc-search">
        <input type="text" id="contact-search" placeholder="Buscar contacto..." oninput="renderContacts()">
      </div>
      <div id="contact-list" class="sc-list"></div>
    </nav>

    <!-- STAGE: ventana de chat -->
    <div id="stage-chat">
      <div id="chat-empty" class="chat-empty">
        <span class="ce-ic">⬡</span>
        <p>ARCHIVO 404 — CHAT</p>
        <span>Selecciona un contacto para comenzar a conversar</span>
      </div>

      <div id="chat-active" class="chat-active hidden">
        <div class="ch-hd">
          <button class="ic-btn only-mobile" onclick="backToList()">←</button>
          <div class="ch-hd-info" id="ch-hd-info" onclick="openProfile('contact')">
            <img id="ch-avatar" class="sc-avatar" src="">
            <div>
              <div class="ch-name" id="ch-name">—</div>
              <div class="ch-status" id="ch-status">—</div>
            </div>
          </div>
        </div>

        <div id="messages" class="messages"></div>

        <div id="reply-bar" class="reply-bar hidden">
          <div class="reply-bar-line"></div>
          <div class="reply-bar-txt">
            <div class="reply-bar-to" id="reply-bar-to">—</div>
            <div class="reply-bar-preview" id="reply-bar-preview">—</div>
          </div>
          <button class="ic-btn" onclick="cancelReply()">✕</button>
        </div>

        <div id="rec-bar" class="rec-bar hidden">
          <span class="rec-dot"></span>
          <span id="rec-time">00:00</span>
          <span class="rec-lbl">Grabando audio...</span>
          <button class="ic-btn" onclick="cancelRecording()">✕ Cancelar</button>
          <button class="pbtn rec-send" onclick="stopAndSendRecording()">✓ Enviar</button>
        </div>

        <div class="input-row" id="input-row">
          <button class="ic-btn" onclick="toggleAttachMenu()">📎</button>
          <div id="attach-menu" class="attach-menu hidden">
            <button onclick="triggerFile('image')">🖼 Foto</button>
            <button onclick="triggerFile('video')">🎬 Video</button>
          </div>
          <input type="file" id="file-image" accept="image/*" class="hidden" onchange="sendFile(this,'image')">
          <input type="file" id="file-video" accept="video/*" class="hidden" onchange="sendFile(this,'video')">
          <input type="text" id="msg-input" placeholder="Escribe un mensaje..." autocomplete="off">
          <button class="ic-btn" id="mic-btn" onclick="startRecording()">🎤</button>
          <button class="ic-btn send-btn" id="send-btn" onclick="sendText()">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════ MODAL: PERFIL ═══════════════ -->
<div id="profile-overlay" class="overlay" onclick="closeProfile()">
  <div class="profile-card" onclick="event.stopPropagation()">
    <button class="lb-close" onclick="closeProfile()">×</button>
    <div class="profile-avatar-wrap" id="profile-avatar-wrap">
      <img id="profile-avatar" src="">
      <input type="file" id="profile-photo-input" accept="image/*" class="hidden" onchange="uploadMyPhoto(this)">
    </div>
    <div class="profile-name" id="profile-name">—</div>
    <div class="profile-apodo" id="profile-apodo">—</div>
    <div class="profile-status" id="profile-status">—</div>
    <div class="profile-since" id="profile-since">—</div>
  </div>
</div>

<!-- ═══════════════ LIGHTBOX (ver imagen/video grande) ═══════════════ -->
<div id="lightbox" class="overlay" onclick="closeLightbox()">
  <div class="lb-inner" onclick="event.stopPropagation()">
    <button class="lb-close" onclick="closeLightbox()">×</button>
    <div id="lb-media"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
